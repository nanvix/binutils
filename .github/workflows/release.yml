name: Release Pipeline

#==================================================================================================
# Trigger Conditions
#==================================================================================================

on:
  schedule:
    # Nightly at 3:00 AM PST (11:00 UTC).
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: release-binutils
  cancel-in-progress: false

#==================================================================================================
# Environment Variables
#==================================================================================================

env:
  # Version of Binutils.
  BINUTILS_VERSION: "2.40"
  # Directory where Binutils will be installed.
  INSTALL_LOCATION: /opt/nanvix

#==================================================================================================
# Jobs
#==================================================================================================

jobs:
  release:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: dev
        fetch-depth: 0

    - name: Setup Git configuration
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get commit information
      id: commit_info
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        TAG_NAME="nanvix-v${BINUTILS_VERSION}-${SHORT_SHA}"
        RELEASE_NAME="nanvix-binutils-${BINUTILS_VERSION}-${SHORT_SHA}"
        BINUTILS_BRANCH="nanvix/v${BINUTILS_VERSION}"
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
        echo "binutils_branch=${BINUTILS_BRANCH}" >> $GITHUB_OUTPUT

    - name: Check if release already exists
      id: check_release
      run: |
        if git ls-remote --tags --exit-code origin "refs/tags/${{ steps.commit_info.outputs.tag_name }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release ${{ steps.commit_info.outputs.tag_name }} already exists, skipping."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    #----------------------------------------------------------------------------------------------
    # Build
    #----------------------------------------------------------------------------------------------

    - name: Restore sccache cache
      if: steps.check_release.outputs.exists == 'false'
      uses: actions/cache@v4
      with:
        path: ~/.cache/sccache
        key: ${{ runner.os }}-sccache-release-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-sccache-release-
          ${{ runner.os }}-sccache

    - name: Enable compiler caching
      if: steps.check_release.outputs.exists == 'false'
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Install dependencies
      if: steps.check_release.outputs.exists == 'false'
      run: sudo ./z setup

    - name: Configure build
      if: steps.check_release.outputs.exists == 'false'
      run: ./z configure --install-location=${{ env.INSTALL_LOCATION }} --release-name=${{ steps.commit_info.outputs.release_name }}

    - name: Build
      if: steps.check_release.outputs.exists == 'false'
      run: ./z build

    - name: Install
      if: steps.check_release.outputs.exists == 'false'
      run: ./z install

    #----------------------------------------------------------------------------------------------
    # Release Artifacts
    #----------------------------------------------------------------------------------------------

    - name: Create release archive
      if: steps.check_release.outputs.exists == 'false'
      run: ./z release

    #----------------------------------------------------------------------------------------------
    # Docker Image
    #----------------------------------------------------------------------------------------------

    - name: Prepare Docker context
      if: steps.check_release.outputs.exists == 'false'
      run: cp -r ${{ env.INSTALL_LOCATION }} ./docker-install

    - name: Set up Docker Buildx
      if: steps.check_release.outputs.exists == 'false'
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      if: steps.check_release.outputs.exists == 'false'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      if: steps.check_release.outputs.exists == 'false'
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/nanvix/binutils:latest
          ghcr.io/nanvix/binutils:${{ steps.commit_info.outputs.short_sha }}

    - name: Make package public
      if: steps.check_release.outputs.exists == 'false'
      run: |
        curl -fsS -X PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/binutils" \
          -d '{"visibility":"public"}' || true

    #----------------------------------------------------------------------------------------------
    # Git Operations
    #----------------------------------------------------------------------------------------------

    - name: Fast-forward release branch
      if: steps.check_release.outputs.exists == 'false'
      run: |
        git push origin HEAD:${{ steps.commit_info.outputs.binutils_branch }}

    - name: Create release tag
      if: steps.check_release.outputs.exists == 'false'
      run: |
        git tag ${{ steps.commit_info.outputs.tag_name }} HEAD
        git push origin ${{ steps.commit_info.outputs.tag_name }}

    - name: Create GitHub Release
      if: steps.check_release.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.commit_info.outputs.tag_name }}
        name: "${{ steps.commit_info.outputs.tag_name }}"
        body: |
          Automated nightly release of Nanvix Binutils ${{ env.BINUTILS_VERSION }}

          Built from commit: ${{ github.sha }}

          This release contains the complete Binutils toolchain configured for the Nanvix operating system target (i686-nanvix).

          **Artifacts:**
          - Tarball: `${{ steps.commit_info.outputs.release_name }}.tar.bz2`
          - Docker: `ghcr.io/nanvix/binutils:${{ steps.commit_info.outputs.short_sha }}`
        files: |
          ${{ steps.commit_info.outputs.release_name }}.tar.bz2
        draft: false
        prerelease: false

    #----------------------------------------------------------------------------------------------
    # Cross-Repository Dispatch
    #----------------------------------------------------------------------------------------------

    - name: Dispatch to gcc
      if: steps.check_release.outputs.exists == 'false'
      run: |
        curl -fsS -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
          https://api.github.com/repos/nanvix/gcc/dispatches \
          -d '{
            "event_type": "binutils-release",
            "client_payload": {
              "binutils_version": "${{ env.BINUTILS_VERSION }}",
              "binutils_tag": "${{ steps.commit_info.outputs.tag_name }}",
              "binutils_sha": "${{ steps.commit_info.outputs.short_sha }}"
            }
          }'
